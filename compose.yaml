services:
  db:
    image: postgres:15-alpine
    container_name: badges_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    networks:
      - backend-network

  backend:
    build: .
    container_name: badges_backend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
