version: '3.9'

services:
  db:
    image: postgres:15
    container_name: badges_db
    restart: always
    environment:
      POSTGRES_USER: badges_user
      POSTGRES_DB: badges
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ./pgdata:/var/lib/postgresql/data:Z
      - ./schemas/init.sql:/docker-entrypoint-initdb.d/00-init.sql:Z
      - ./schemas/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:Z
      - ./schemas/migrations/20260315_conference_roles.sql:/docker-entrypoint-initdb.d/02-conference.sql:Z
    secrets:
      - postgres_password
    networks:
      - backend-network

  backend:
    build: .
    container_name: badges_backend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - backend-network
    volumes:
      - .:/app:Z
      - /app/node_modules  

networks:
  backend-network:
    driver: bridge

secrets:
  postgres_password:
    file: ./postgres_password.txt

